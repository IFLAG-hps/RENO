version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - node scripts/generate-config.mjs
        - npm run build:react
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  customRules:
    - source: /pages/<*>
      target: /
      status: '302'
  cache:
    paths:
      - node_modules/**/*
