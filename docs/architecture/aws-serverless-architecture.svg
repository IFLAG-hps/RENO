<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">RENO AWSサーバーレス構成案</title>
  <desc id="desc">AmplifyからAPI Gateway、Lambda、SQS、S3、DynamoDBへ接続するAWS構成図。CloudWatch Logsは運用ログとして利用する。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6770"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#172b4d" flood-opacity=".14"/></filter>
    <style>
      .title{font:700 30px Arial,"Yu Gothic",sans-serif;fill:#172b4d}.subtitle{font:400 16px Arial,"Yu Gothic",sans-serif;fill:#5b6770}
      .group{font:700 18px Arial,"Yu Gothic",sans-serif;fill:#172b4d}.label{font:700 15px Arial,"Yu Gothic",sans-serif;fill:#172b4d}.small{font:400 13px Arial,"Yu Gothic",sans-serif;fill:#5b6770}
      .card{fill:#fff;stroke:#d5dce3;stroke-width:2;rx:14;filter:url(#shadow)}.optional{fill:#fbfcfd;stroke:#9aa7b2;stroke-width:2;stroke-dasharray:8 6;rx:14}
      .line{stroke:#5b6770;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dashed{stroke:#8c9aa6;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f7f9fb"/>
  <text x="70" y="58" class="title">RENO AWSサーバーレス構成案</text>
  <text x="70" y="87" class="subtitle">初期構成：Amplify + API Gateway + Lambda + S3 + DynamoDB ／ 重い処理のみSQSで非同期化</text>

  <rect x="50" y="125" width="1500" height="540" fill="#fff" stroke="#d5dce3" stroke-width="2" rx="20"/>
  <text x="80" y="160" class="group">利用者向けアプリケーション</text>
  <rect x="80" y="185" width="230" height="150" class="card"/>
  <text x="195" y="218" text-anchor="middle" class="label">利用者のブラウザ</text>
  <text x="195" y="245" text-anchor="middle" class="small">相談・写真アップロード</text>
  <text x="195" y="267" text-anchor="middle" class="small">見積もり・担当者相談</text>
  <circle cx="195" cy="302" r="18" fill="#e9eef3"/><path d="M185 297h20v12h-20z M188 291h14v5h-14z" fill="#5b6770"/>

  <rect x="385" y="185" width="230" height="150" class="card"/>
  <image x="470" y="198" width="60" height="60" href="../assets/aws-icons/amplify.svg"/>
  <text x="500" y="282" text-anchor="middle" class="label">AWS Amplify Hosting</text>
  <text x="500" y="306" text-anchor="middle" class="small">静的フロントエンド / CloudFront</text>

  <rect x="690" y="185" width="230" height="150" class="card"/>
  <image x="775" y="198" width="60" height="60" href="../assets/aws-icons/api-gateway.svg"/>
  <text x="805" y="282" text-anchor="middle" class="label">Amazon API Gateway</text>
  <text x="805" y="306" text-anchor="middle" class="small">認証付きAPIの入口</text>

  <rect x="995" y="185" width="230" height="150" class="card"/>
  <image x="1080" y="198" width="60" height="60" href="../assets/aws-icons/cognito.svg"/>
  <text x="1110" y="282" text-anchor="middle" class="label">Amazon Cognito</text>
  <text x="1110" y="306" text-anchor="middle" class="small">ログインが必要な場合のみ</text>

  <path d="M310 260H385 M615 260H690 M920 260H995" class="line"/>

  <rect x="80" y="400" width="820" height="220" fill="#fff8ed" stroke="#f0b457" stroke-width="2" rx="16"/>
  <text x="110" y="438" class="group">Lambda / サーバーレス業務ロジック</text>
  <g>
    <rect x="110" y="465" width="155" height="115" class="card"/><image x="158" y="475" width="55" height="55" href="../assets/aws-icons/lambda.svg"/><text x="187" y="557" text-anchor="middle" class="label">チャット</text>
    <rect x="285" y="465" width="155" height="115" class="card"/><image x="333" y="475" width="55" height="55" href="../assets/aws-icons/lambda.svg"/><text x="362" y="557" text-anchor="middle" class="label">画像診断</text>
    <rect x="460" y="465" width="155" height="115" class="card"/><image x="508" y="475" width="55" height="55" href="../assets/aws-icons/lambda.svg"/><text x="537" y="557" text-anchor="middle" class="label">概算見積もり</text>
    <rect x="635" y="465" width="155" height="115" class="card"/><image x="683" y="475" width="55" height="55" href="../assets/aws-icons/lambda.svg"/><text x="712" y="557" text-anchor="middle" class="label">担当者相談</text>
  </g>
  <path d="M805 335V400" class="line"/>

  <rect x="950" y="400" width="550" height="220" fill="#eef7ff" stroke="#72a9d8" stroke-width="2" rx="16"/>
  <text x="980" y="438" class="group">データ・非同期処理</text>
  <rect x="980" y="465" width="145" height="115" class="card"/><image x="1025" y="475" width="55" height="55" href="../assets/aws-icons/s3.svg"/><text x="1052" y="557" text-anchor="middle" class="label">Amazon S3</text>
  <rect x="1150" y="465" width="145" height="115" class="card"/><image x="1195" y="475" width="55" height="55" href="../assets/aws-icons/dynamodb.svg"/><text x="1222" y="557" text-anchor="middle" class="label">DynamoDB</text>
  <rect x="1320" y="465" width="145" height="115" class="card"/><image x="1365" y="475" width="55" height="55" href="../assets/aws-icons/sqs.svg"/><text x="1392" y="548" text-anchor="middle" class="label">SQS + DLQ</text><text x="1392" y="570" text-anchor="middle" class="small">画像生成・PDF</text>
  <path d="M900 515H980 M900 550H1150 M900 585H1320" class="line"/>

  <rect x="50" y="700" width="1500" height="205" class="optional"/>
  <text x="80" y="738" class="group">運用・ドメイン（初期は最小構成で開始可能）</text>
  <rect x="365" y="765" width="190" height="105" class="optional"/><image x="427" y="775" width="48" height="48" href="../assets/aws-icons/cloudwatch.svg"/><text x="460" y="847" text-anchor="middle" class="label">CloudWatch Logs</text><text x="460" y="865" text-anchor="middle" class="small">最低限のログ・アラーム</text>
  <text x="900" y="802" class="small">※ SQSは重い処理のみ非同期化。通常のチャット・見積もりは同期Lambdaで開始。</text>
  <text x="900" y="830" class="small">※ アイコンはAWS Architecture Icons（公式配布素材）を使用。</text>
  <text x="900" y="858" class="small">※ 料金・無料枠はリージョンと契約条件により変動。</text>
</svg>
