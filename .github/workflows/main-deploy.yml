name: "CI: Test and optionally deploy backend"

on:
  push:
    branches: [main, feature/makeActions, feature/mvp]
  pull_request:
    branches: [main, feature/mvp]
  workflow_dispatch:
    inputs:
      deploy_aws:
        description: Deploy the backend to production after CI passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  STACK_NAME: reno-mvp

jobs:
  test:
    name: Test LocalStack, SAM, and local E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Start LocalStack
        run: |
          docker run -d --name localstack \
            -p 4566:4566 \
            -e SERVICES=dynamodb,s3,ses \
            -e DEBUG=0 \
            -e ACTIVATE_PRO=0 \
            localstack/localstack:4.4.0
      - name: Run LocalStack tests
        env:
          AWS_ENDPOINT_URL: http://127.0.0.1:4566
        run: python -m unittest discover -s backend/tests -p "test_*.py" -v
      - name: Show LocalStack logs on failure
        if: failure()
        run: docker logs localstack
      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
      - name: Validate and build SAM application
        run: |
          sam validate --template-file backend/template.yaml --lint
          sam build --template-file backend/template.yaml
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install frontend test dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local API
        env:
          AWS_ENDPOINT_URL: http://127.0.0.1:4566
          AWS_DEFAULT_REGION: ap-northeast-1
          OPENAI_API_KEY: ""
          PORT: 3000
          LOCAL_PIN: 5678
        run: |
          nohup python backend/local_server.py >/tmp/reno-api.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:3000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/reno-api.log
          exit 1
      - name: Run local frontend E2E
        env:
          RENO_API_URL: http://127.0.0.1:3000/agent
          RENO_MOCK_CHAT: "false"
          E2E_PIN: "5678"
          E2E_USE_REAL_API: "true"
        run: |
          npm run build:config
          npm run test:e2e
      - name: Show local API logs on failure
        if: failure()
        run: cat /tmp/reno-api.log 2>/dev/null || true

  deploy:
    name: Deploy backend and verify the deployed API
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_aws == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Validate and build backend
        run: |
          sam validate --template-file backend/template.yaml --lint
          sam build --template-file backend/template.yaml
      - name: Deploy backend resources
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          DEMO_PIN: ${{ vars.DEMO_PIN || '1234' }}
          UNLIMITED_MODE: ${{ vars.UNLIMITED_MODE || 'true' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          SES_FROM_EMAIL: ${{ vars.SES_FROM_EMAIL || '' }}
          SES_TO_EMAIL: ${{ vars.SES_TO_EMAIL || '' }}
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$TOKEN_SECRET"
          PARAM_OVERRIDES=(
            "OpenAIApiKey=$OPENAI_API_KEY"
            "OpenAIModel=$OPENAI_MODEL"
            "TokenSecret=$TOKEN_SECRET"
            "DemoPin=$DEMO_PIN"
            "UnlimitedMode=$UNLIMITED_MODE"
          )
          if [ -n "$ADMIN_EMAIL" ]; then PARAM_OVERRIDES+=("AdminEmail=$ADMIN_EMAIL"); fi
          if [ -n "$SES_FROM_EMAIL" ]; then PARAM_OVERRIDES+=("SesFromEmail=$SES_FROM_EMAIL"); fi
          if [ -n "$SES_TO_EMAIL" ]; then PARAM_OVERRIDES+=("SesToEmail=$SES_TO_EMAIL"); fi
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${PARAM_OVERRIDES[@]}"
      - name: Read deployed API URL
        id: stack
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          test -n "$API_URL"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed API: $API_URL"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend verification dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Smoke-test deployed API
        env:
          API_URL: ${{ steps.stack.outputs.api_url }}
          E2E_PIN: ${{ vars.DEMO_PIN || '1234' }}
        run: node scripts/smoke-api.mjs
      - name: Run frontend E2E against deployed API
        env:
          RENO_API_URL: ${{ steps.stack.outputs.api_url }}
          RENO_MOCK_CHAT: "false"
          E2E_PIN: ${{ vars.DEMO_PIN || '1234' }}
          E2E_USE_REAL_API: "true"
        run: |
          npm run build:config
          npx playwright test e2e/real-api.spec.mjs
