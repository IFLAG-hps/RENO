name: "CI: Validate application"

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate
        required: true
        type: string
  push:
    branches:
      - main
      - staging
      - dev
  pull_request:
    branches:
      - main
      - staging
      - dev
  workflow_dispatch:
    inputs:
      deploy_aws:
        description: AWSバックエンドもデプロイする
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  STACK_NAME: reno-mvp

jobs:
  test:
    name: Test LocalStack, SAM, and E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade boto3

      - name: Start LocalStack
        run: |
          docker run -d --name localstack \
            -p 4566:4566 \
            -e SERVICES=dynamodb,s3,ses \
            -e DEBUG=0 \
            -e ACTIVATE_PRO=0 \
            localstack/localstack:4.4.0

      - name: Run LocalStack smoke tests
        env:
          AWS_ENDPOINT_URL: http://127.0.0.1:4566
        run: python -m unittest discover -s backend/tests -p "test_*.py" -v

      - name: Show LocalStack logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs localstack

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM template
        run: sam validate --template-file backend/template.yaml --lint

      - name: Build SAM application
        run: sam build --template-file backend/template.yaml

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: E2E依存関係をインストール
        run: npm ci

      - name: Chromiumをインストール
        run: npx playwright install --with-deps chromium

      - name: ローカルAPIを起動
        run: |
          docker run -d --name reno-api \
            -p 3000:3000 \
            --add-host host.docker.internal:host-gateway \
            -e AWS_ENDPOINT_URL=http://host.docker.internal:4566 \
            -e AWS_DEFAULT_REGION=ap-northeast-1 \
            -e OPENAI_API_KEY="" \
            -e PORT=3000 \
            -e LOCAL_PIN=5678 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            python:3.12-slim \
            sh -lc 'pip install -q boto3 && python backend/local_server.py'
          for i in {1..30}; do curl -sf http://127.0.0.1:3000/health >/dev/null && break; sleep 2; done

      - name: E2Eテストを実行
        env:
          RENO_API_URL: http://127.0.0.1:3000/agent
          RENO_MOCK_CHAT: "false"
          E2E_PIN: "5678"
          E2E_USE_REAL_API: "true"
        run: |
          npm run build:config
          npm run test:e2e

      - name: E2E失敗時のログを表示
        if: failure()
        run: docker logs reno-api || true

  deploy:
    name: Optional deploy to AWS (manual)
    needs: test
    # AWS更新は手動実行で明示的に許可した場合だけ行う。
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build SAM application
        run: sam build --template-file backend/template.yaml

      - name: Deploy SAM application
        run: >-
          sam deploy
          --template-file .aws-sam/build/template.yaml
          --stack-name "$STACK_NAME"
          --region "$AWS_REGION"
          --resolve-s3
          --capabilities CAPABILITY_IAM
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides
          LambdaExecutionRoleName=RENOProductionLambdaExecutionRole
          OpenAIApiKey="${{ secrets.OPENAI_API_KEY }}"
          OpenAIModel="${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}"
          TokenSecret="${{ secrets.TOKEN_SECRET }}"
          UnlimitedMode="${{ vars.UNLIMITED_MODE || 'true' }}"
