name: "CI: Test and optionally deploy backend"

on:
  push:
    branches:
      - main
      - feature/makeActions
      - feature/mvp
  pull_request:
    branches:
      - main
      - feature/mvp
  workflow_dispatch:
    inputs:
      deploy_aws:
        description: AWSバックエンドもデプロイする
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  STACK_NAME: reno-mvp

jobs:
  test:
    name: Test LocalStack, SAM, and E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-test.txt

      - name: Start LocalStack
        run: |
          docker run -d --name localstack \
            -p 4566:4566 \
            -e SERVICES=dynamodb,s3,ses \
            -e DEBUG=0 \
            -e ACTIVATE_PRO=0 \
            localstack/localstack:4.4.0

      - name: Run LocalStack smoke tests
        env:
          AWS_ENDPOINT_URL: http://127.0.0.1:4566
        run: python -m unittest discover -s backend/tests -p "test_*.py" -v

      - name: Show LocalStack logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs localstack

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM template
        run: sam validate --template-file backend/template.yaml --lint

      - name: Build SAM application
        run: sam build --template-file backend/template.yaml

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: E2E依存関係をインストール
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Chromiumをインストール
        run: npx playwright install --with-deps chromium

      - name: ローカルAPIを起動
        run: |
          AWS_ENDPOINT_URL=http://127.0.0.1:4566 \
          AWS_DEFAULT_REGION=ap-northeast-1 \
          OPENAI_API_KEY="" \
          PORT=3000 \
          LOCAL_PIN=5678 \
          nohup python backend/local_server.py >/tmp/reno-api.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:3000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/reno-api.log
          exit 1

      - name: E2Eテストを実行
        env:
          RENO_API_URL: http://127.0.0.1:3000/agent
          RENO_MOCK_CHAT: "false"
          E2E_PIN: "5678"
          E2E_USE_REAL_API: "true"
        run: |
          npm run build:config
          npm run test:e2e

      - name: E2E失敗時のログを表示
        if: failure()
        run: cat /tmp/reno-api.log 2>/dev/null || true

  deploy:
    name: Optional deploy to AWS (manual)
    needs: test
    # AWS更新は手動実行で明示的に許可した場合だけ行う。
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_aws == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build SAM application
        run: sam build --template-file backend/template.yaml

      - name: Deploy SAM application
        run: >-
          sam deploy
          --template-file .aws-sam/build/template.yaml
          --stack-name "$STACK_NAME"
          --region "$AWS_REGION"
          --resolve-s3
          --capabilities CAPABILITY_IAM
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides
          OpenAIApiKey="${{ secrets.OPENAI_API_KEY }}"
          OpenAIModel="${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}"
          TokenSecret="${{ secrets.TOKEN_SECRET }}"
          UnlimitedMode="${{ vars.UNLIMITED_MODE || 'true' }}"
