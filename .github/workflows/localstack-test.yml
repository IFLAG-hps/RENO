name: "REUSABLE: LocalStack integration tests"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Run backend LocalStack tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: python -m pip install --upgrade -r backend/requirements-test.txt

      - name: Start LocalStack
        run: |
          docker run -d --name localstack \
            -p 4566:4566 \
            -e SERVICES=dynamodb,s3,ses \
            -e DEBUG=0 \
            -e ACTIVATE_PRO=0 \
            localstack/localstack:4.4.0

      - name: Run LocalStack integration tests
        env:
          AWS_ENDPOINT_URL: http://127.0.0.1:4566
        run: python -m unittest discover -s backend/tests -p "test_localstack.py" -v

      - name: Show LocalStack logs on failure
        if: failure()
        run: docker logs localstack
